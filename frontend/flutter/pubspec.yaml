name: travel_mate
description: 보고가고 React+Vite 원본을 화면별 Dart 파일로 분리한 Flutter 프로젝트
publish_to: 'none'
version: 1.0.0+1
environment:
  sdk: '>=3.9.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_map: ^8.3.2
  latlong2: ^0.10.1
  geolocator: ^14.0.3
  speech_to_text: ^7.4.0
  http: ^1.6.0
  http_parser: ^4.1.2
  image_picker: ^1.2.1
  shared_preferences: ^2.5.5
  flutter_local_notifications: ^22.3.1
  workmanager: ^0.10.10
  kakao_flutter_sdk_user: 2.0.1
  kakao_flutter_sdk_common: 2.0.1
  kakao_flutter_sdk_share: 2.0.1
  webview_flutter: 4.14.1
  app_links: 7.2.2
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/images/
